name: "Checks"
on:
  push:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          persist-credentials: false
      - uses: pass-culture/common-workflows/actions/actionlint-check@afae2577022181fccdaead9537235886c461f36a
    semgrep_scan:
      name: Semgrep scan
      runs-on: ubuntu-22.04
      container:
        image: semgrep/semgrep@sha256:a3d49dc967b8534a6a76628e50c51cbfe33eb7195dc2feab1fdc0f100852c8ef # v1.156.0
      if: (github.actor != 'dependabot[bot]')

      steps:
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
          with:
            fetch-depth: 0
            persist-credentials: false

        - name: Perform Semgrep Analysis
          env:
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
          run: |
            semgrep scan --config auto --baseline-commit "$BASE_SHA" --error