name: "CI Security Checks"
on:
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          persist-credentials: false
      - name: Authenticate through github app ghactionci
        uses: actions/create-github-app-token@v3.2.0
        id: github-token
        with:
          app-id: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_ID }}
          private-key: ${{ secrets.PASSCULTURE_GITHUB_ACTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Configure Github
        run: git config --global url."https://oauth2:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
      - uses: jdx/mise-action@v4.3.0
        with:
          github_token: ${{ steps.github-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
      - run: mise use -g pipx:pass-culture/passdirector@POC-add-ci-security-check
      - run: mise use -g zizmor
      - run: mise use -g 'github:pass-culture/actionlint[github_attestations=false]@0.4.0'
      - run: passdirector checks ci
