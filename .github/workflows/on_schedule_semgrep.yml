name: 3 [CI] Daily Security scan

on:
  schedule:
    # “At 09:12”
    - cron: '12 9 * * *'
  workflow_dispatch:

jobs:
  semgrep_scan:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:a3d49dc967b8534a6a76628e50c51cbfe33eb7195dc2feab1fdc0f100852c8ef # v1.156.0
    if: (github.actor != 'dependabot[bot]')
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Perform Semgrep Analysis
        run: semgrep scan --config auto . --sarif-output=semgrep-results.sarif --error

      - name: Save SARIF results as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: semgrep-scan-results
          path: semgrep-results.sarif
