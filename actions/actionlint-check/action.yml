name: actionlint-check
description: "Action to setup and run actionlint"
inputs:
  version:
    description: "actionlint version"
    default: "0.4.0"
    required: false
  ignore-unpinned-sha:
    description: "Ignore the rule that triggers when actions or workflows are called but not pinned to a specific SHA. Useful if using Actions lockfiles"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Install actionlint"
      run: |
        curl -sSL -o actionlint.tar.gz "https://github.com/pass-culture/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
        tar -zxvf actionlint.tar.gz && rm actionlint.tar.gz
        if [ "$IGNORE_UNPINNED_SHA" == "true" ]; then
          ./actionlint -ignore 'invalid format because ref is not a commit sha' ./.github/workflows/*.yml
        else
          ./actionlint ./.github/workflows/*.yml
        fi
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTIONLINT_ARGS: ${{ inputs.actionlint-args }}
        IGNORE_UNPINNED_SHA: ${{ inputs.ignore-unpinned-sha }}
